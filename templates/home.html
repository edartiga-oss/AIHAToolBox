<div class="wrap">

  <div class="toolbar">
    <form id="tool-search" role="search" onsubmit="return false;">
      <label class="visually-hidden" for="search-input">Search assessment tools</label>
      <div class="search">
        <span class="search__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </span>
        <input id="search-input" type="search" autocomplete="off"
               placeholder="Search by tool name, description, developer, output, or hazard…">
        <button type="button" id="search-clear" class="search__clear" aria-label="Clear search">&times;</button>
      </div>
    </form>

    <div class="filters">
{{FILTERS}}
    </div>
  </div>

  <div class="results-bar">
    <p id="results-count" role="status" aria-live="polite">Showing all {{TOOL_COUNT}} tools</p>
    <button type="button" id="reset-filters" class="link-button" hidden>Reset all filters</button>
  </div>

  <div class="table-wrap">
    <table class="tools-table" id="tools-table">
      <caption class="visually-hidden">Exposure assessment tools, filterable by type, hazard, exposure route, and assessment category</caption>
      <thead>
        <tr>
          <th scope="col">Tool</th>
          <th scope="col">What it does</th>
          <th scope="col">Category</th>
          <th scope="col">Developer</th>
          <th scope="col">Output</th>
        </tr>
      </thead>
      <tbody id="tools-body">
{{ROWS}}
      </tbody>
    </table>
  </div>

  <div class="empty-state" id="empty-state" hidden>
    <h3>No tools match those filters</h3>
    <p>Try removing a filter or searching for a broader term.</p>
  </div>
</div>
